# Card pacco Amazon, con il logo Amazon al posto dell'icona: intestazione, timeline a 4 tappe, tappa, ultimo evento, numero d'ordine e destinazione.
# Senza pacchi in arrivo resta una riga sola; si espande quando c'è un pacco in viaggio.
#
# Richiede queste card (tutte disponibili in HACS):
#   - Mushroom            https://github.com/piitaya/lovelace-mushroom
#   - card-mod            https://github.com/thomasloven/lovelace-card-mod
#   - Vertical Stack In Card  https://github.com/ofekashery/vertical-stack-in-card
#
# Serve anche l'immagine del logo: copia `custom_components/amazon_orders/brand/icon.png` in
# `/config/www/amazon_orders/icon.png` (se la cartella `www` non esisteva, riavvia Home Assistant una volta).
#
# ID DELLE ENTITÀ: questo file usa gli ID che Home Assistant crea in italiano (`sensor.amazon_...`).
# Controlla i tuoi in Impostazioni > Entità (cerca "amazon") e fai cerca/sostituisci prima di incollare.
#
# Mostra il "prossimo pacco", cioè quello più avanti nella consegna. Alla consegna la card torna a riposo.
# PRIVACY: l'ultima riga mostra numero d'ordine, destinatario e città. Se il dashboard è
# visibile ad altri, cancella l'ultimo blocco ("Numero d'ordine e destinazione").

type: custom:vertical-stack-in-card
cards:
  # ── Intestazione ──
  - type: custom:mushroom-template-card
    entity: sensor.amazon_stato_prossimo_pacco
    primary: >
      {% set items = state_attr('sensor.amazon_stato_prossimo_pacco', 'items') or [] %}
      {% if is_state('sensor.amazon_stato_prossimo_pacco', 'idle') %}Amazon
      {% elif items %}{{ items[0] | truncate(60, true, '…') }}
      {% else %}Pacco in arrivo{% endif %}
    # Con più articoli nello stesso pacco aggiunge " · N articoli" alla prima riga
    secondary: >-
      {% set event = states('sensor.amazon_ultimo_evento_prossimo_pacco') %}
      {% set n = (state_attr('sensor.amazon_stato_prossimo_pacco', 'items') or []) | count %}
      {% set more = ' · ' ~ n ~ ' articoli' if n > 1 else '' %}
      {% if is_state('sensor.amazon_stato_prossimo_pacco', 'idle') %}Nessun pacco in arrivo
      {% elif has_value('sensor.amazon_consegna_prossimo_pacco') %}{{ states('sensor.amazon_consegna_prossimo_pacco') }}{{ more }}{{ '\n' ~ event if has_value('sensor.amazon_ultimo_evento_prossimo_pacco') else '' }}
      {% else %}Pacco in arrivo{{ more }}{% endif %}
    multiline_secondary: true
    picture: /local/amazon_orders/icon.png
    # Il tocco apre i tuoi ordini sul sito Amazon
    tap_action:
      action: url
      url_path: https://www.amazon.it/your-orders/orders
    # La pressione prolungata controlla subito lo stato su Amazon
    hold_action:
      action: perform-action
      perform_action: homeassistant.update_entity
      target:
        entity_id: sensor.amazon_stato_prossimo_pacco
    card_mod:
      style:
        # Disco bianco dietro al logo, che altrimenti sparisce sui temi scuri.
        ha-tile-icon$: |
          .container {
            background: #fff;
            {% if is_state('sensor.amazon_stato_prossimo_pacco', 'idle') %}
            filter: grayscale(1);
            opacity: 0.5;
            {% endif %}
          }
          .container img {
            box-sizing: border-box;
            padding: 5px;
            object-fit: contain;
          }

  # ── Timeline a 4 tappe: la linea avanza come nell'app Amazon (non cliccabile) ──
  - type: conditional
    conditions:
      - condition: state
        entity: sensor.amazon_stato_prossimo_pacco
        state_not: idle
    card:
      type: custom:mushroom-chips-card
      alignment: justify
      card_mod:
        style: |
          {% set stop = states('sensor.amazon_avanzamento_prossimo_pacco') | int(0) %}
          ha-card {
            position: relative;
            z-index: 0;
            padding: 8px 16px 4px !important;
            pointer-events: none;
            --chip-background: var(--ha-card-background, var(--card-background-color));
            --chip-border-width: 0;
            --chip-box-shadow: none;
          }
          ha-card::before {
            content: "";
            position: absolute;
            left: 34px; right: 34px;
            top: calc(50% + 2px);
            height: 2px;
            z-index: -1;
            background: linear-gradient(90deg,
              #ff9900 {{ stop }}%,
              rgba(127, 127, 127, 0.3) {{ stop }}%);
          }
      chips:
        # 1 · Ordinato
        - type: template
          icon: >
            {% set i = state_attr('sensor.amazon_tappa_prossimo_pacco', 'step_index') | int(0) %}
            {{ 'mdi:check' if i > 1 else 'mdi:cart-check' }}
          icon_color: >
            {% set i = state_attr('sensor.amazon_tappa_prossimo_pacco', 'step_index') | int(0) %}
            {{ 'orange' if i >= 1 else 'disabled' }}
          tap_action: { action: none }
          hold_action: { action: none }
          double_tap_action: { action: none }
          card_mod:
            style: |
              {% if state_attr('sensor.amazon_tappa_prossimo_pacco', 'step_index') | int(0) == 1 %}
              ha-card { --chip-background: color-mix(in srgb, #ff9900 25%, var(--ha-card-background, var(--card-background-color))); }
              {% endif %}
        # 2 · Spedito
        - type: template
          icon: >
            {% set i = state_attr('sensor.amazon_tappa_prossimo_pacco', 'step_index') | int(0) %}
            {{ 'mdi:check' if i > 2 else 'mdi:package-variant-closed' }}
          icon_color: >
            {% set i = state_attr('sensor.amazon_tappa_prossimo_pacco', 'step_index') | int(0) %}
            {{ 'orange' if i >= 2 else 'disabled' }}
          tap_action: { action: none }
          hold_action: { action: none }
          double_tap_action: { action: none }
          card_mod:
            style: |
              {% if state_attr('sensor.amazon_tappa_prossimo_pacco', 'step_index') | int(0) == 2 %}
              ha-card { --chip-background: color-mix(in srgb, #ff9900 25%, var(--ha-card-background, var(--card-background-color))); }
              {% endif %}
        # 3 · In consegna
        - type: template
          icon: >
            {% set i = state_attr('sensor.amazon_tappa_prossimo_pacco', 'step_index') | int(0) %}
            {{ 'mdi:check' if i > 3 else 'mdi:truck-delivery' }}
          icon_color: >
            {% set i = state_attr('sensor.amazon_tappa_prossimo_pacco', 'step_index') | int(0) %}
            {{ 'orange' if i >= 3 else 'disabled' }}
          tap_action: { action: none }
          hold_action: { action: none }
          double_tap_action: { action: none }
          card_mod:
            style: |
              {% if state_attr('sensor.amazon_tappa_prossimo_pacco', 'step_index') | int(0) == 3 %}
              ha-card { --chip-background: color-mix(in srgb, #ff9900 25%, var(--ha-card-background, var(--card-background-color))); }
              {% endif %}
        # 4 · Consegnato
        - type: template
          icon: >
            {% set i = state_attr('sensor.amazon_tappa_prossimo_pacco', 'step_index') | int(0) %}
            {{ 'mdi:check' if i > 4 else 'mdi:home-import-outline' }}
          icon_color: >
            {% set i = state_attr('sensor.amazon_tappa_prossimo_pacco', 'step_index') | int(0) %}
            {{ 'orange' if i >= 4 else 'disabled' }}
          tap_action: { action: none }
          hold_action: { action: none }
          double_tap_action: { action: none }
          card_mod:
            style: |
              {% if state_attr('sensor.amazon_tappa_prossimo_pacco', 'step_index') | int(0) == 4 %}
              ha-card { --chip-background: color-mix(in srgb, #ff9900 25%, var(--ha-card-background, var(--card-background-color))); }
              {% endif %}

  # ── Tappa, ultimo evento, altri pacchi (non cliccabili) ──
  - type: conditional
    conditions:
      - condition: state
        entity: sensor.amazon_stato_prossimo_pacco
        state_not: idle
    card:
      type: custom:mushroom-chips-card
      alignment: center
      card_mod:
        style: |
          ha-card {
            padding: 4px 16px 4px !important;
            pointer-events: none;
          }
      chips:
        - type: conditional
          conditions:
            - condition: state
              entity: sensor.amazon_tappa_prossimo_pacco
              state_not: unknown
          chip:
            type: template
            icon: mdi:timeline-check
            content: "{{ states('sensor.amazon_tappa_prossimo_pacco') }}"
            icon_color: orange
            tap_action: { action: none }
            hold_action: { action: none }
            double_tap_action: { action: none }
        - type: conditional
          conditions:
            - condition: state
              entity: sensor.amazon_ultimo_evento_prossimo_pacco
              state_not: unknown
          chip:
            type: template
            icon: mdi:map-marker-path
            content: >
              {% set time = state_attr('sensor.amazon_ultimo_evento_prossimo_pacco', 'time') %}
              {% set place = state_attr('sensor.amazon_ultimo_evento_prossimo_pacco', 'location') %}
              {% set day = state_attr('sensor.amazon_ultimo_evento_prossimo_pacco', 'date') %}
              {{ [time, place] | select | join(' · ') or day or states('sensor.amazon_ultimo_evento_prossimo_pacco') }}
            icon_color: orange
            tap_action: { action: none }
            hold_action: { action: none }
            double_tap_action: { action: none }
        - type: conditional
          conditions:
            - condition: numeric_state
              entity: sensor.amazon_pacchi_in_arrivo
              above: 1
          chip:
            type: template
            icon: mdi:package-variant-closed-plus
            content: >
              {% set n = states('sensor.amazon_pacchi_in_arrivo') | int(1) - 1 %}
              +{{ n }} {{ 'altro pacco' if n == 1 else 'altri pacchi' }}
            icon_color: grey
            tap_action: { action: none }
            hold_action: { action: none }
            double_tap_action: { action: none }

  # ── Numero d'ordine e destinazione (non cliccabili) ──
  - type: conditional
    conditions:
      - condition: state
        entity: sensor.amazon_stato_prossimo_pacco
        state_not: idle
    card:
      type: custom:mushroom-chips-card
      alignment: center
      card_mod:
        style: |
          ha-card {
            padding: 0 16px 12px !important;
            pointer-events: none;
          }
      chips:
        - type: template
          icon: mdi:receipt-text-outline
          content: "{{ state_attr('sensor.amazon_stato_prossimo_pacco', 'order_id') }}"
          icon_color: grey
          tap_action: { action: none }
          hold_action: { action: none }
          double_tap_action: { action: none }
        - type: template
          icon: mdi:map-marker-account-outline
          content: >
            {% set s = 'sensor.amazon_stato_prossimo_pacco' %}
            {{ [state_attr(s, 'recipient'), state_attr(s, 'delivery_city')] | select | join(' · ') }}
          icon_color: grey
          tap_action: { action: none }
          hold_action: { action: none }
          double_tap_action: { action: none }
