# Amazon package card: header, four-step timeline, step, last event, order number and destination.
# It stays on one line while nothing is on its way and expands when a package is.
#
# It needs these cards (all available in HACS):
#   - Mushroom            https://github.com/piitaya/lovelace-mushroom
#   - card-mod            https://github.com/thomasloven/lovelace-card-mod
#   - Vertical Stack In Card  https://github.com/ofekashery/vertical-stack-in-card
#
# ENTITY IDS: this file uses the ids Home Assistant creates in English (`sensor.amazon_...`).
# Check yours in Settings > Entities (search "amazon") and find/replace them before pasting.
#
# It shows the "next package", the one furthest along. Once delivered the card goes back to idle.
# PRIVACY: the last row shows the order number, the recipient and the town. If others can see
# the dashboard, delete the last block ("Order number and destination").

type: custom:vertical-stack-in-card
cards:
  # ── Header ──
  - type: custom:mushroom-template-card
    entity: sensor.amazon_next_package_status
    primary: >
      {% set items = state_attr('sensor.amazon_next_package_status', 'items') or [] %}
      {% if is_state('sensor.amazon_next_package_status', 'idle') %}Amazon
      {% elif items %}{{ items[0] | truncate(60, true, '…') }}
      {% else %}Package on its way{% endif %}
    # With several items in the same package it adds " · N items" to the first line
    secondary: >-
      {% set event = states('sensor.amazon_next_package_last_event') %}
      {% set n = (state_attr('sensor.amazon_next_package_status', 'items') or []) | count %}
      {% set more = ' · ' ~ n ~ ' items' if n > 1 else '' %}
      {% if is_state('sensor.amazon_next_package_status', 'idle') %}Nothing on its way
      {% elif has_value('sensor.amazon_next_package_delivery') %}{{ states('sensor.amazon_next_package_delivery') }}{{ more }}{{ '\n' ~ event if has_value('sensor.amazon_next_package_last_event') else '' }}
      {% else %}Package on its way{{ more }}{% endif %}
    multiline_secondary: true
    icon: >
      {% set i = state_attr('sensor.amazon_next_package_step', 'step_index') | int(0) %}
      {% if is_state('sensor.amazon_next_package_status', 'idle') %}mdi:package-variant-closed
      {% elif i >= 3 %}mdi:truck-delivery
      {% elif i == 2 %}mdi:truck-fast
      {% else %}mdi:cart-check{% endif %}
    color: >
      {{ 'grey' if is_state('sensor.amazon_next_package_status', 'idle') else 'orange' }}
    # Tap opens your orders on the Amazon website
    tap_action:
      action: url
      url_path: https://www.amazon.it/your-orders/orders
    # Hold checks the state on Amazon right away
    hold_action:
      action: perform-action
      perform_action: homeassistant.update_entity
      target:
        entity_id: sensor.amazon_next_package_status

  # ── Four-step timeline: the line moves on as in the Amazon app (not clickable) ──
  - type: conditional
    conditions:
      - condition: state
        entity: sensor.amazon_next_package_status
        state_not: idle
    card:
      type: custom:mushroom-chips-card
      alignment: justify
      card_mod:
        style: |
          {% set stop = states('sensor.amazon_next_package_progress') | int(0) %}
          ha-card {
            position: relative;
            z-index: 0;
            padding: 8px 16px 4px !important;
            pointer-events: none;
            --chip-background: var(--ha-card-background, var(--card-background-color));
            --chip-border-width: 0;
            --chip-box-shadow: none;
          }
          ha-card::before {
            content: "";
            position: absolute;
            left: 34px; right: 34px;
            top: calc(50% + 2px);
            height: 2px;
            z-index: -1;
            background: linear-gradient(90deg,
              #ff9900 {{ stop }}%,
              rgba(127, 127, 127, 0.3) {{ stop }}%);
          }
      chips:
        # 1 · Ordered
        - type: template
          icon: >
            {% set i = state_attr('sensor.amazon_next_package_step', 'step_index') | int(0) %}
            {{ 'mdi:check' if i > 1 else 'mdi:cart-check' }}
          icon_color: >
            {% set i = state_attr('sensor.amazon_next_package_step', 'step_index') | int(0) %}
            {{ 'orange' if i >= 1 else 'disabled' }}
          tap_action: { action: none }
          hold_action: { action: none }
          double_tap_action: { action: none }
          card_mod:
            style: |
              {% if state_attr('sensor.amazon_next_package_step', 'step_index') | int(0) == 1 %}
              ha-card { --chip-background: color-mix(in srgb, #ff9900 25%, var(--ha-card-background, var(--card-background-color))); }
              {% endif %}
        # 2 · Shipped
        - type: template
          icon: >
            {% set i = state_attr('sensor.amazon_next_package_step', 'step_index') | int(0) %}
            {{ 'mdi:check' if i > 2 else 'mdi:package-variant-closed' }}
          icon_color: >
            {% set i = state_attr('sensor.amazon_next_package_step', 'step_index') | int(0) %}
            {{ 'orange' if i >= 2 else 'disabled' }}
          tap_action: { action: none }
          hold_action: { action: none }
          double_tap_action: { action: none }
          card_mod:
            style: |
              {% if state_attr('sensor.amazon_next_package_step', 'step_index') | int(0) == 2 %}
              ha-card { --chip-background: color-mix(in srgb, #ff9900 25%, var(--ha-card-background, var(--card-background-color))); }
              {% endif %}
        # 3 · Out for delivery
        - type: template
          icon: >
            {% set i = state_attr('sensor.amazon_next_package_step', 'step_index') | int(0) %}
            {{ 'mdi:check' if i > 3 else 'mdi:truck-delivery' }}
          icon_color: >
            {% set i = state_attr('sensor.amazon_next_package_step', 'step_index') | int(0) %}
            {{ 'orange' if i >= 3 else 'disabled' }}
          tap_action: { action: none }
          hold_action: { action: none }
          double_tap_action: { action: none }
          card_mod:
            style: |
              {% if state_attr('sensor.amazon_next_package_step', 'step_index') | int(0) == 3 %}
              ha-card { --chip-background: color-mix(in srgb, #ff9900 25%, var(--ha-card-background, var(--card-background-color))); }
              {% endif %}
        # 4 · Delivered
        - type: template
          icon: >
            {% set i = state_attr('sensor.amazon_next_package_step', 'step_index') | int(0) %}
            {{ 'mdi:check' if i > 4 else 'mdi:home-import-outline' }}
          icon_color: >
            {% set i = state_attr('sensor.amazon_next_package_step', 'step_index') | int(0) %}
            {{ 'orange' if i >= 4 else 'disabled' }}
          tap_action: { action: none }
          hold_action: { action: none }
          double_tap_action: { action: none }
          card_mod:
            style: |
              {% if state_attr('sensor.amazon_next_package_step', 'step_index') | int(0) == 4 %}
              ha-card { --chip-background: color-mix(in srgb, #ff9900 25%, var(--ha-card-background, var(--card-background-color))); }
              {% endif %}

  # ── Step, last event, other packages (not clickable) ──
  - type: conditional
    conditions:
      - condition: state
        entity: sensor.amazon_next_package_status
        state_not: idle
    card:
      type: custom:mushroom-chips-card
      alignment: center
      card_mod:
        style: |
          ha-card {
            padding: 4px 16px 4px !important;
            pointer-events: none;
          }
      chips:
        - type: conditional
          conditions:
            - condition: state
              entity: sensor.amazon_next_package_step
              state_not: unknown
          chip:
            type: template
            icon: mdi:timeline-check
            content: "{{ states('sensor.amazon_next_package_step') }}"
            icon_color: orange
            tap_action: { action: none }
            hold_action: { action: none }
            double_tap_action: { action: none }
        - type: conditional
          conditions:
            - condition: state
              entity: sensor.amazon_next_package_last_event
              state_not: unknown
          chip:
            type: template
            icon: mdi:map-marker-path
            content: >
              {% set time = state_attr('sensor.amazon_next_package_last_event', 'time') %}
              {% set place = state_attr('sensor.amazon_next_package_last_event', 'location') %}
              {% set day = state_attr('sensor.amazon_next_package_last_event', 'date') %}
              {{ [time, place] | select | join(' · ') or day or states('sensor.amazon_next_package_last_event') }}
            icon_color: orange
            tap_action: { action: none }
            hold_action: { action: none }
            double_tap_action: { action: none }
        - type: conditional
          conditions:
            - condition: numeric_state
              entity: sensor.amazon_packages_in_transit
              above: 1
          chip:
            type: template
            icon: mdi:package-variant-closed-plus
            content: >
              {% set n = states('sensor.amazon_packages_in_transit') | int(1) - 1 %}
              +{{ n }} {{ 'more package' if n == 1 else 'more packages' }}
            icon_color: grey
            tap_action: { action: none }
            hold_action: { action: none }
            double_tap_action: { action: none }

  # ── Order number and destination (not clickable) ──
  - type: conditional
    conditions:
      - condition: state
        entity: sensor.amazon_next_package_status
        state_not: idle
    card:
      type: custom:mushroom-chips-card
      alignment: center
      card_mod:
        style: |
          ha-card {
            padding: 0 16px 12px !important;
            pointer-events: none;
          }
      chips:
        - type: template
          icon: mdi:receipt-text-outline
          content: "{{ state_attr('sensor.amazon_next_package_status', 'order_id') }}"
          icon_color: grey
          tap_action: { action: none }
          hold_action: { action: none }
          double_tap_action: { action: none }
        - type: template
          icon: mdi:map-marker-account-outline
          content: >
            {% set s = 'sensor.amazon_next_package_status' %}
            {{ [state_attr(s, 'recipient'), state_attr(s, 'delivery_city')] | select | join(' · ') }}
          icon_color: grey
          tap_action: { action: none }
          hold_action: { action: none }
          double_tap_action: { action: none }
